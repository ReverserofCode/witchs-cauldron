##### docker-compose.prod.yml: 프로덕션 환경 (Frontend + Backend) #####
services:
  # ===== Analytics: Postgres =====
  analytics-db:
    container_name: witchs-cauldron-analytics-db-prod
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=analytics
      - POSTGRES_PASSWORD=analytics
      - POSTGRES_DB=analytics
    volumes:
      - analytics_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U analytics -d analytics
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Backend: FastAPI + Selenium 클립 수집 서비스 =====
  backend:
    container_name: witchs-cauldron-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: witchs-cauldron-backend:latest
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HEADLESS=false
      - USE_XVFB=true
      - CLIP_AUTO_COLLECT_ENABLED=${CLIP_AUTO_COLLECT_ENABLED:-true}
      - CLIP_AUTO_COLLECT_INTERVAL_MINUTES=${CLIP_AUTO_COLLECT_INTERVAL_MINUTES:-720}
      - CLIP_AUTO_COLLECT_RUN_ON_STARTUP=${CLIP_AUTO_COLLECT_RUN_ON_STARTUP:-false}
      - CLIP_AUTO_COLLECT_STARTUP_DELAY_SECONDS=${CLIP_AUTO_COLLECT_STARTUP_DELAY_SECONDS:-60}
      - CLIP_AUTO_COLLECT_MAX_CLIPS=${CLIP_AUTO_COLLECT_MAX_CLIPS:-2}
      - CLIP_AUTO_COLLECT_FILTER_TYPE=${CLIP_AUTO_COLLECT_FILTER_TYPE:-ALL}
      - CLIP_AUTO_COLLECT_ORDER_TYPE=${CLIP_AUTO_COLLECT_ORDER_TYPE:-RECENT}
      - CLIP_AUTO_COLLECT_FAILURE_COOLDOWN_MINUTES=${CLIP_AUTO_COLLECT_FAILURE_COOLDOWN_MINUTES:-720}
    # Shared memory for Chrome/Xvfb (prevents crashes)
    shm_size: '2gb'
    volumes:
      # 클립 공유 볼륨 (읽기/쓰기)
      - shared_clips:/app/shared/clips
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Frontend: Next.js 프로덕션 서버 =====
  frontend:
    container_name: witchs-cauldron-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    image: witchs-cauldron-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - COLLECT_API_KEY=${COLLECT_API_KEY:-}
      # YouTube Data API
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      # Analytics (Postgres)
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL:-}
      - ADMIN_BASIC_AUTH_USERNAME=${ADMIN_BASIC_AUTH_USERNAME:-}
      - ADMIN_BASIC_AUTH_PASSWORD=${ADMIN_BASIC_AUTH_PASSWORD:-}
      - ADMIN_ALLOWED_EMAILS=${ADMIN_ALLOWED_EMAILS:-}
      - ANALYTICS_PUBLIC=${ANALYTICS_PUBLIC:-}
      # CHZZK Open API credentials
      - CHZZK_CLIENT_ID=${CHZZK_CLIENT_ID:-}
      - CHZZK_CLIENT_SECRET=${CHZZK_CLIENT_SECRET:-}
    volumes:
      # 백엔드와 동일 shared volume을 읽기 전용으로 마운트
      - shared_clips:/app/public/clips:ro
    depends_on:
      backend:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node healthcheck.js
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 볼륨 정의
volumes:
  # 클립 공유 볼륨 (Backend ↔ Frontend)
  shared_clips: null
  # analytics db data
  analytics_data: null
