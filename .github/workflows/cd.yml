name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend syntax check
        run: python -m py_compile backend/app/main.py

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Preflight SSH connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/${SSH_HOST}/${SSH_PORT}"

      - name: Deploy to server
        id: deploy_primary
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          envs: CHZZK_CLIENT_ID,CHZZK_CLIENT_SECRET
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            touch .env
            grep -v '^CHZZK_CLIENT_ID=' .env | grep -v '^CHZZK_CLIENT_SECRET=' > .env.tmp || true
            mv .env.tmp .env
            echo "CHZZK_CLIENT_ID=${CHZZK_CLIENT_ID}" >> .env
            echo "CHZZK_CLIENT_SECRET=${CHZZK_CLIENT_SECRET}" >> .env
            ./frontend/deploy.sh --clean

      - name: Retry deploy once on SSH failure
        if: steps.deploy_primary.outcome == 'failure' && contains(steps.deploy_primary.outputs.stdout || '', 'dial tcp')
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          envs: CHZZK_CLIENT_ID,CHZZK_CLIENT_SECRET
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            touch .env
            grep -v '^CHZZK_CLIENT_ID=' .env | grep -v '^CHZZK_CLIENT_SECRET=' > .env.tmp || true
            mv .env.tmp .env
            echo "CHZZK_CLIENT_ID=${CHZZK_CLIENT_ID}" >> .env
            echo "CHZZK_CLIENT_SECRET=${CHZZK_CLIENT_SECRET}" >> .env
            ./frontend/deploy.sh --clean
