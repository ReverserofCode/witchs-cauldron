name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend validation
        run: |
          python -m compileall -q backend/app
          PYTHONPATH=backend python -c "from app.main import app; print(app.title)"

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Preflight SSH connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          timeout 8 bash -c "cat < /dev/null > /dev/tcp/${SSH_HOST}/${SSH_PORT}"

      - name: Deploy to server
        id: deploy_primary
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
          ADMIN_BASIC_AUTH_USERNAME: ${{ secrets.ADMIN_BASIC_AUTH_USERNAME }}
          ADMIN_BASIC_AUTH_PASSWORD: ${{ secrets.ADMIN_BASIC_AUTH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.DESK_SSH_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          envs: CHZZK_CLIENT_ID,CHZZK_CLIENT_SECRET,ADMIN_BASIC_AUTH_USERNAME,ADMIN_BASIC_AUTH_PASSWORD
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            touch .env
            cp .env .env.tmp
            upsert_env_var() {
              local name="$1"
              local value="$2"
              if [ -z "${value}" ]; then
                return 0
              fi
              grep -v "^${name}=" .env.tmp > .env.next || true
              mv .env.next .env.tmp
              printf '%s=%s\n' "${name}" "${value}" >> .env.tmp
            }
            upsert_env_var CHZZK_CLIENT_ID "${CHZZK_CLIENT_ID:-}"
            upsert_env_var CHZZK_CLIENT_SECRET "${CHZZK_CLIENT_SECRET:-}"
            upsert_env_var ADMIN_BASIC_AUTH_USERNAME "${ADMIN_BASIC_AUTH_USERNAME:-}"
            upsert_env_var ADMIN_BASIC_AUTH_PASSWORD "${ADMIN_BASIC_AUTH_PASSWORD:-}"
            mv .env.tmp .env
            ./frontend/deploy.sh --clean

      - name: Retry deploy once on SSH failure
        if: steps.deploy_primary.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
          ADMIN_BASIC_AUTH_USERNAME: ${{ secrets.ADMIN_BASIC_AUTH_USERNAME }}
          ADMIN_BASIC_AUTH_PASSWORD: ${{ secrets.ADMIN_BASIC_AUTH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.DESK_SSH_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          envs: CHZZK_CLIENT_ID,CHZZK_CLIENT_SECRET,ADMIN_BASIC_AUTH_USERNAME,ADMIN_BASIC_AUTH_PASSWORD
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            touch .env
            cp .env .env.tmp
            upsert_env_var() {
              local name="$1"
              local value="$2"
              if [ -z "${value}" ]; then
                return 0
              fi
              grep -v "^${name}=" .env.tmp > .env.next || true
              mv .env.next .env.tmp
              printf '%s=%s\n' "${name}" "${value}" >> .env.tmp
            }
            upsert_env_var CHZZK_CLIENT_ID "${CHZZK_CLIENT_ID:-}"
            upsert_env_var CHZZK_CLIENT_SECRET "${CHZZK_CLIENT_SECRET:-}"
            upsert_env_var ADMIN_BASIC_AUTH_USERNAME "${ADMIN_BASIC_AUTH_USERNAME:-}"
            upsert_env_var ADMIN_BASIC_AUTH_PASSWORD "${ADMIN_BASIC_AUTH_PASSWORD:-}"
            mv .env.tmp .env
            ./frontend/deploy.sh --clean
